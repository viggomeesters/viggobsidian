[package]
name = "activity-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde_json = "1"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
link-style-core = { path = "../link-style-core" }
