[package]
name = "viggobsidian"
version = "0.32.1"
default-run = "viggobsidian"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Versioned vault policy, checks and drift-safe package updates"
publish = false

[dependencies]
activity-core = { path = "crates/activity-core" }
dossier-retrieval-core = { path = "crates/dossier-retrieval-core" }
serde_json = "1"
libc = "=0.2.191"
sha2 = "=0.10.9"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }

[workspace]
members = ["crates/vault-layout", "crates/link-style-core", "crates/wiki-layout-core", "crates/source-preparation-core", "crates/activity-core", "crates/structure-core", "crates/dossier-retrieval-core", "crates/mail-manifest-core", "crates/quick-capture-core", "crates/task-status-core", "crates/task-selection-core", "crates/task-date-core"]
resolver = "3"
